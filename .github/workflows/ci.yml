name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      # instance/ is gitignored, so on a fresh checkout tests/test_route_smoke.py
      # takes its "no real DB" branch and replays the entire alembic chain once
      # per parametrized route — 245 times in one process. That leaks ~20 MB per
      # test and peaks near 5 GB, which is what has been OOM-killing this job.
      # Building the file once here drops the whole run to a measured 934 MB.
      # The script migrates AND seeds: a migrate-only database makes the fixture
      # AttributeError on first_tournament.id for all 245 tests. Sets its own
      # DATABASE_URL/SECRET_KEY, so it needs no env block here.
      - name: Build seeded route-smoke database
        env:
          PROAM_ALLOW_CI_SMOKE_DB_BUILD: "1"
        run: python scripts/ci_build_smoke_db.py

      - name: Run tests
        env:
          FLASK_ENV: testing
          SECRET_KEY: ci-test-secret-key
          DATABASE_URL: sqlite:///test.db
          TEST_USE_CREATE_ALL: "1"
          PROAM_ROUTE_SMOKE_SOURCE_DB: instance/ci_route_smoke.db
        run: |
          pytest -x -q --tb=short \
            --ignore=tests/test_migration_integrity.py

  postgres-smoke:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: missoula_pro_am_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d missoula_pro_am_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Apply migrations on PostgreSQL
        env:
          FLASK_APP: app.py
          FLASK_ENV: testing
          SECRET_KEY: ci-postgres-secret-key
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/missoula_pro_am_test
        run: flask db upgrade

      - name: Run PostgreSQL smoke tests
        env:
          FLASK_ENV: testing
          SECRET_KEY: ci-postgres-secret-key
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/missoula_pro_am_test
        run: pytest tests/test_postgres_runtime_smoke.py -q

  # D14-B: the whole unit suite on the engine production actually runs.
  #
  # The `test` job above is the fast lane: SQLite, create_all, ~4 minutes. It
  # stays, because a 4-minute answer on every push is worth having. But it
  # cannot see anything that only breaks under PostgreSQL, and this codebase
  # has shipped exactly that kind of bug before (a global connect listener
  # that fired SQLite PRAGMAs at PostgreSQL connections, invisible in the
  # fast lane and in production alike). This job closes that hole.
  #
  # The suite builds one schema template via migrations, then clones it per
  # app (createdb -T, ~100ms). Nothing here is shared with the `postgres-smoke`
  # job, which only proves migrations apply and a handful of routes answer.
  unit-postgres:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      # Same reason as the fast lane: without a seeded instance DB,
      # test_route_smoke.py replays the alembic chain once per parametrized
      # route and peaks near 5 GB.
      - name: Build seeded route-smoke database
        env:
          PROAM_ALLOW_CI_SMOKE_DB_BUILD: "1"
        run: python scripts/ci_build_smoke_db.py

      - name: Run the unit suite on PostgreSQL
        env:
          FLASK_ENV: testing
          SECRET_KEY: ci-unit-postgres-secret-key
          PROAM_UNIT_PG: "1"
          PROAM_UNIT_PG_HOST: localhost
          PROAM_UNIT_PG_USER: postgres
          PROAM_UNIT_PG_PASSWORD: postgres
          PROAM_ROUTE_SMOKE_SOURCE_DB: instance/ci_route_smoke.db
        run: pytest tests -q --tb=short -p no:randomly

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Check for syntax errors
        run: python -m compileall app.py routes services models

      - name: Ruff lint
        run: ruff check .

  migration-safety:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run migration integrity checks
        env:
          FLASK_ENV: testing
          SECRET_KEY: ci-migration-secret-key
          DATABASE_URL: sqlite:///test_migration.db
        run: |
          pytest tests/test_migration_integrity.py::TestMigrationIntegrity -q
          pytest tests/test_pg_migration_safety.py -q

  pip-audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip

      - name: Install requirements + pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit

      - name: Run pip-audit on installed deps (excluding strathmark)
        # We can't use `pip-audit -r requirements.txt` because requirements.txt
        # pins strathmark via a git URL that pip-audit cannot look up against
        # PyPI's vulnerability database (it errors out in --strict mode).
        # Workaround: take `pip freeze` of the resolved environment, drop the
        # strathmark line (which is published privately), and audit the rest.
        # Strathmark itself is pinned to a specific commit SHA in
        # requirements.txt — that's the supply-chain control for it.
        run: |
          pip freeze | grep -v -i '^strathmark' > /tmp/installed-without-strathmark.txt
          pip-audit -r /tmp/installed-without-strathmark.txt --strict
