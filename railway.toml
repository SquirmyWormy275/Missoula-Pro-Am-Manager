[deploy]
# preDeployCommand is the modern Railway/Railpack field for "run this between
# build and traffic-flip; block deploy if it fails."  The old `releaseCommand`
# field was a Heroku-buildpack-era name that Railpack silently ignores — it had
# been a no-op in this project for over two weeks (see
# memory/incident_2026-04-08_postgres_recovery.md and the v3 PLAN_REVIEW.md
# Phase 1 deploy incident notes).  Renaming to preDeployCommand activates the
# release-phase pipeline so `flask db upgrade` actually runs on every deploy.
preDeployCommand = "flask db upgrade"

# ---------------------------------------------------------------------------
# STRATHMARK environment variables (set in the Railway dashboard, not here)
# ---------------------------------------------------------------------------
# Railway env vars must be configured via the dashboard or `railway variables
# set` -- they cannot be declared in railway.toml.  The values below are the
# recommended production settings for the Pro-Am Manager service.
#
# Required (enables the integration at all -- without these the strathmark
# package is installed but every push function silently no-ops):
#   STRATHMARK_SUPABASE_URL   = https://<project>.supabase.co
#   STRATHMARK_SUPABASE_KEY   = <service or anon key>
#
# Authoritative handicap numbers are deterministic and do not use an LLM.
# Do not configure Ollama, Gemini, or another narrative provider as a numeric
# prediction dependency. Optional reviewed narrative work belongs outside the
# race-day mark-assignment and shadow-authority paths.
# ---------------------------------------------------------------------------
